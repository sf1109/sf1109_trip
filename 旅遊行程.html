<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊行程管理系統</title>
    
    <!-- 網頁 Icon 設定 -->
    <link rel="icon" href="icon.jpg" type="image/jpeg">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <!-- Header (抬頭名稱可直接修改) -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
            <div class="flex-1 min-w-[200px]">
                <!-- 主標題編輯區 -->
                <div class="flex items-center gap-2 group">
                    <i class="fa-solid fa-plane-departure text-lg"></i>
                    <input type="text" id="site-title-input" value="我的旅遊行程" onchange="updateSiteTitle(this.value)" class="bg-transparent text-xl font-bold border-b border-transparent hover:border-indigo-300 focus:border-white focus:outline-none w-full transition py-0.5">
                </div>
                <!-- 副標題編輯區 -->
                <div class="flex items-center gap-2 mt-1">
                    <input type="text" id="site-subtitle-input" value="點擊即可修改行程備註與日期" onchange="updateSiteSubtitle(this.value)" class="bg-transparent text-xs text-indigo-200 border-b border-transparent hover:border-indigo-300 focus:border-white focus:outline-none w-full transition py-0.5">
                </div>
            </div>
            
            <!-- 功能按鈕 -->
            <div class="flex items-center gap-2">
                <button onclick="exportData()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-400 transition flex items-center gap-1">
                    <i class="fa-solid fa-download"></i> 匯出
                </button>
                <button onclick="document.getElementById('import-file').click()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-400 transition flex items-center gap-1">
                    <i class="fa-solid fa-upload"></i> 匯入
                </button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
                <button onclick="resetData()" class="text-xs bg-red-600 hover:bg-red-700 px-2.5 py-1.5 rounded-lg border border-red-400 transition" title="清空所有資料">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 mt-6">

        <!-- 天數管理與頁籤區 -->
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">行程天數管理</h2>
            <button onclick="addDay()" class="text-xs font-medium bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2.5 py-1 rounded-md border border-indigo-200 transition flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> 新增一天
            </button>
        </div>

        <div id="day-tabs" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <!-- 由 JS 動態渲染天數頁籤 -->
        </div>

        <!-- 當前天數控制區 (編輯/刪除日期) -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 mt-3 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span id="current-day-badge" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded">Day 1</span>
                <input type="text" id="day-date-input" placeholder="例如: 10/01 (一)" onchange="updateDayDate(this.value)" class="text-sm font-semibold text-slate-700 border border-slate-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="deleteCurrentDay()" class="text-xs text-red-500 hover:text-red-700 hover:bg-red-50 px-2.5 py-1 rounded border border-red-200 transition">
                <i class="fa-solid fa-calendar-minus"></i> 刪除此天
            </button>
        </div>

        <!-- 行程新增區塊 -->
        <div class="bg-white p-4 rounded-xl shadow-md mt-4 border border-slate-200">
            <h2 class="text-sm font-bold text-slate-600 mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-plus-circle text-indigo-500"></i> 新增景點 / 活動
            </h2>
            <form id="add-item-form" onsubmit="handleAddSchedule(event)" class="grid grid-cols-1 md:grid-cols-12 gap-2">
                <input type="time" id="input-time" required class="md:col-span-3 border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="text" id="input-title" placeholder="景點/活動名稱" required class="md:col-span-4 border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="text" id="input-note" placeholder="備註說明 (選填)" class="md:col-span-3 border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="md:col-span-2 bg-indigo-600 text-white font-medium rounded-lg p-2 text-sm hover:bg-indigo-700 transition">
                    新增
                </button>
            </form>
        </div>

        <!-- 當日行程清單 -->
        <div class="mt-6">
            <div class="flex justify-between items-center mb-3">
                <h2 id="current-day-title" class="text-lg font-bold text-slate-700">Day 1 行程</h2>
                <span id="item-count" class="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded-full">0 個項目</span>
            </div>
            
            <div id="schedule-list" class="space-y-3">
                <!-- 行程卡片由 JS 動態渲染 -->
            </div>
        </div>

    </main>

    <!-- 編輯景點彈出視窗 (Modal) -->
    <div id="edit-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-5 border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 編輯景點內容
            </h3>
            <form onsubmit="handleSaveEdit(event)" class="space-y-3">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">時間</label>
                    <input type="time" id="edit-time" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">景點 / 活動名稱</label>
                    <input type="text" id="edit-title" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">備註說明</label>
                    <input type="text" id="edit-note" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex justify-end gap-2 mt-4 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">取消</button>
                    <button type="submit" class="px-4 py-2 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition">儲存修改</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 預設純空的基礎結構
        const defaultTitle = "我的旅遊行程";
        const defaultSubtitle = "點擊即可修改行程備註與日期";
        
        const defaultDays = [
            { id: 1, dayNum: 1, date: "第一天" }
        ];

        const defaultSchedules = {
            1: []
        };

        // 從 LocalStorage 載入資料或使用預設空白資料
        let siteTitle = localStorage.getItem('trip_site_title') || defaultTitle;
        let siteSubtitle = localStorage.getItem('trip_site_subtitle') || defaultSubtitle;
        let daysData = JSON.parse(localStorage.getItem('trip_days_data')) || defaultDays;
        let scheduleData = JSON.parse(localStorage.getItem('trip_schedule_data')) || defaultSchedules;
        let currentDayId = daysData.length > 0 ? daysData[0].id : null;

        document.addEventListener('DOMContentLoaded', () => {
            initHeaderInfo();
            renderTabs();
            renderCurrentDayHeader();
            renderSchedule();
        });

        // 初始化與渲染標題
        function initHeaderInfo() {
            document.getElementById('site-title-input').value = siteTitle;
            document.getElementById('site-subtitle-input').value = siteSubtitle;
            document.title = siteTitle;
        }

        function updateSiteTitle(val) {
            siteTitle = val || "我的旅遊行程";
            document.title = siteTitle;
            localStorage.setItem('trip_site_title', siteTitle);
        }

        function updateSiteSubtitle(val) {
            siteSubtitle = val;
            localStorage.setItem('trip_site_subtitle', siteSubtitle);
        }

        // 渲染天數頁籤
        function renderTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';

            if (daysData.length === 0) {
                tabsContainer.innerHTML = `<span class="text-xs text-slate-400 py-2">目前沒有任何天數，請點擊上方新增。</span>`;
                return;
            }

            daysData.forEach((item, index) => {
                const isActive = item.id === currentDayId;
                const tab = document.createElement('button');
                tab.className = `flex-1 min-w-[90px] py-2 px-3 rounded-lg text-center transition flex flex-col items-center border ${
                    isActive 
                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' 
                        : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                }`;
                tab.onclick = () => switchDay(item.id);
                tab.innerHTML = `
                    <span class="text-xs font-bold ${isActive ? 'text-indigo-200' : 'text-slate-400'}">Day ${index + 1}</span>
                    <span class="text-sm font-semibold">${item.date || '設定日期'}</span>
                `;
                tabsContainer.appendChild(tab);
            });
        }

        // 切換天數
        function switchDay(dayId) {
            currentDayId = dayId;
            renderTabs();
            renderCurrentDayHeader();
            renderSchedule();
        }

        // 渲染當前日期的控制欄 (日期編輯)
        function renderCurrentDayHeader() {
            const currentDayObj = daysData.find(d => d.id === currentDayId);
            const badge = document.getElementById('current-day-badge');
            const input = document.getElementById('day-date-input');

            if (currentDayObj) {
                const index = daysData.findIndex(d => d.id === currentDayId);
                badge.innerText = `Day ${index + 1}`;
                input.value = currentDayObj.date || '';
            } else {
                badge.innerText = 'N/A';
                input.value = '';
            }
        }

        // 新增一天
        function addDay() {
            const newId = Date.now();
            const newDayNum = daysData.length + 1;
            daysData.push({ id: newId, dayNum: newDayNum, date: `第 ${newDayNum} 天` });
            scheduleData[newId] = [];
            currentDayId = newId;
            
            saveData();
            renderTabs();
            renderCurrentDayHeader();
            renderSchedule();
        }

        // 刪除當前天數
        function deleteCurrentDay() {
            if (!currentDayId) return;
            if (confirm('確定要刪除這天及其內的所有行程內容嗎？')) {
                daysData = daysData.filter(d => d.id !== currentDayId);
                delete scheduleData[currentDayId];
                
                currentDayId = daysData.length > 0 ? daysData[0].id : null;
                saveData();
                renderTabs();
                renderCurrentDayHeader();
                renderSchedule();
            }
        }

        // 修改當前天的日期名稱
        function updateDayDate(newDateStr) {
            const currentDayObj = daysData.find(d => d.id === currentDayId);
            if (currentDayObj) {
                currentDayObj.date = newDateStr;
                saveData();
                renderTabs();
            }
        }

        // 渲染當日行程清單
        function renderSchedule() {
            const listContainer = document.getElementById('schedule-list');
            const dayTitle = document.getElementById('current-day-title');
            const itemCount = document.getElementById('item-count');
            
            const currentDayObj = daysData.find(d => d.id === currentDayId);
            const dayIndex = daysData.findIndex(d => d.id === currentDayId);
            
            dayTitle.innerText = currentDayObj ? `Day ${dayIndex + 1} 行程規劃 (${currentDayObj.date})` : '請先新增天數';
            listContainer.innerHTML = '';

            if (!currentDayId || !scheduleData[currentDayId]) {
                itemCount.innerText = '0 個項目';
                listContainer.innerHTML = `<div class="text-center py-8 text-slate-400 bg-white rounded-xl border border-dashed border-slate-300">請先新增天數以開始排行程。</div>`;
                return;
            }

            const dayItems = scheduleData[currentDayId];
            itemCount.innerText = `${dayItems.length} 個項目`;

            if (dayItems.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-8 text-slate-400 bg-white rounded-xl border border-dashed border-slate-300">
                        <i class="fa-regular fa-calendar-xmark text-3xl mb-2"></i>
                        <p class="text-sm">目前無行程，請使用上方表單新增項目。</p>
                    </div>
                `;
                return;
            }

            // 按時間排序
            dayItems.sort((a, b) => a.time.localeCompare(b.time));

            dayItems.forEach(item => {
                const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.title)}`;
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-start justify-between gap-3 hover:shadow-md transition";
                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="bg-indigo-50 text-indigo-600 font-bold text-xs px-2.5 py-1.5 rounded-md border border-indigo-100 flex items-center gap-1">
                            <i class="fa-regular fa-clock"></i> ${item.time}
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-base">${item.title}</h3>
                            ${item.note ? `<p class="text-xs text-slate-500 mt-1">${item.note}</p>` : ''}
                            <a href="${googleMapUrl}" target="_blank" class="inline-flex items-center gap-1 text-xs text-indigo-500 hover:text-indigo-700 mt-2 font-medium">
                                <i class="fa-solid fa-location-dot"></i> Google 地圖導航
                            </a>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="openEditModal(${item.id})" class="text-slate-400 hover:text-indigo-600 transition p-1.5 rounded hover:bg-slate-100" title="編輯">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-red-500 transition p-1.5 rounded hover:bg-slate-100" title="刪除">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 新增景點
        function handleAddSchedule(e) {
            e.preventDefault();
            if (!currentDayId) {
                alert('請先建立天數後再新增項目');
                return;
            }

            const time = document.getElementById('input-time').value;
            const title = document.getElementById('input-title').value;
            const note = document.getElementById('input-note').value;

            const newItem = { id: Date.now(), time, title, note };
            scheduleData[currentDayId].push(newItem);
            
            saveData();
            renderSchedule();
            document.getElementById('add-item-form').reset();
        }

        // 開啟編輯彈窗
        function openEditModal(itemId) {
            const item = scheduleData[currentDayId].find(i => i.id === itemId);
            if (!item) return;

            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-time').value = item.time;
            document.getElementById('edit-title').value = item.title;
            document.getElementById('edit-note').value = item.note || '';

            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // 關閉編輯彈窗
        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // 儲存編輯修改
        function handleSaveEdit(e) {
            e.preventDefault();
            const id = Number(document.getElementById('edit-id').value);
            const item = scheduleData[currentDayId].find(i => i.id === id);

            if (item) {
                item.time = document.getElementById('edit-time').value;
                item.title = document.getElementById('edit-title').value;
                item.note = document.getElementById('edit-note').value;

                saveData();
                renderSchedule();
                closeEditModal();
            }
        }

        // 刪除景點
        function deleteItem(id) {
            if (confirm('確定要刪除此項目嗎？')) {
                scheduleData[currentDayId] = scheduleData[currentDayId].filter(item => item.id !== id);
                saveData();
                renderSchedule();
            }
        }

        // 匯出 JSON 資料
        function exportData() {
            const fullData = {
                title: siteTitle,
                subtitle: siteSubtitle,
                days: daysData,
                schedules: scheduleData
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${siteTitle || 'my_trip'}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 匯入 JSON 資料
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.days && importedData.schedules) {
                        siteTitle = importedData.title || defaultTitle;
                        siteSubtitle = importedData.subtitle || defaultSubtitle;
                        daysData = importedData.days;
                        scheduleData = importedData.schedules;
                        currentDayId = daysData.length > 0 ? daysData[0].id : null;
                        
                        saveData();
                        initHeaderInfo();
                        renderTabs();
                        renderCurrentDayHeader();
                        renderSchedule();
                        alert('行程資料匯入成功！');
                    } else {
                        alert('檔案格式不正確！');
                    }
                } catch (err) {
                    alert('無法讀取該檔案，請確定是正確的 JSON 格式。');
                }
            };
            reader.readAsText(file);
        }

        // 儲存全站資料至 LocalStorage
        function saveData() {
            localStorage.setItem('trip_site_title', siteTitle);
            localStorage.setItem('trip_site_subtitle', siteSubtitle);
            localStorage.setItem('trip_days_data', JSON.stringify(daysData));
            localStorage.setItem('trip_schedule_data', JSON.stringify(scheduleData));
        }

        // 清空重置
        function resetData() {
            if (confirm('確定要清空所有資料並還原為純空白狀態嗎？')) {
                localStorage.clear();
                siteTitle = defaultTitle;
                siteSubtitle = defaultSubtitle;
                daysData = JSON.parse(JSON.stringify(defaultDays));
                scheduleData = JSON.parse(JSON.stringify(defaultSchedules));
                currentDayId = daysData[0].id;
                
                initHeaderInfo();
                renderTabs();
                renderCurrentDayHeader();
                renderSchedule();
            }
        }
    </script>
</body>
</html>
